{% extends "admin_base.html" %}
{% block title %}Run CRM login{% endblock %}
{% block content %}
<div class="card login">
  <h1>Staff login</h1>
  {% if error %}<p class="warn">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <div><label>Username</label><input name="user" autocomplete="username" required></div>
    <div><label>Password</label><input name="pass" type="password" autocomplete="current-password" required></div>
    <button type="submit">Open CRM</button>
  </form>
  <p class="muted">World Heart Day 5K/10K run registrations and payment screenshots.</p>
</div>
{% endblock %}
